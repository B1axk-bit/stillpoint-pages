<style>
/* Layout: a verdict board. Masthead, one verdict above the fold, then numbered modules that each open with their conclusion; cards only where a module is a separate object. */
:root{
  --bg:#edf1f0; --surface:#fbfcfc; --surface-2:#e5ebea; --ink:#0f2027; --ink-2:#46595e; --muted:#5f7074;
  --line:#d3dcdb; --grid:#e1e8e7; --axis:#9aabae;
  --brass:#8a5d0c; --brass-hi:#a8721a; --brass-wash:#f0e2c2; --brass-tint:#f7f0e0;
  --neg:#2a78d6; --neg-soft:#9db7d6; --pos:#eb6834; --pos-soft:#f3b496; --mag:#8a9a9e;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-wash:#ddeedd; --warn-wash:#fbeecb; --crit-wash:#f7dddb;
  --z-strong:#e3e9e8; --z-mid:#ecf1f0; --z-edge:#f6eedb;
  --inv-bg:#0f2027; --inv-fg:#f4f7f6; --inv-tag:#d8a94f;
  --shadow:0 1px 0 rgba(15,32,39,.03),0 10px 24px -18px rgba(15,32,39,.25);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1316; --surface:#111c1f; --surface-2:#18262a; --ink:#e4ecea; --ink-2:#a6b6b4; --muted:#80918f;
  --line:#22333a; --grid:#1a282c; --axis:#3e5157;
  --brass:#d8a94f; --brass-hi:#e9c27a; --brass-wash:#3a2e17; --brass-tint:#1e1a12;
  --neg:#3987e5; --neg-soft:#3f5b7c; --pos:#d95926; --pos-soft:#7d4630; --mag:#5c6f73;
  --good-wash:#12301a; --warn-wash:#33290f; --crit-wash:#3a1a1a;
  --z-strong:#1a282c; --z-mid:#152226; --z-edge:#211d14;
  --inv-bg:#1c2b2f; --inv-fg:#e4ecea; --inv-tag:#d8a94f;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1316; --surface:#111c1f; --surface-2:#18262a; --ink:#e4ecea; --ink-2:#a6b6b4; --muted:#80918f;
  --line:#22333a; --grid:#1a282c; --axis:#3e5157;
  --brass:#d8a94f; --brass-hi:#e9c27a; --brass-wash:#3a2e17; --brass-tint:#1e1a12;
  --neg:#3987e5; --neg-soft:#3f5b7c; --pos:#d95926; --pos-soft:#7d4630; --mag:#5c6f73;
  --good-wash:#12301a; --warn-wash:#33290f; --crit-wash:#3a1a1a;
  --z-strong:#1a282c; --z-mid:#152226; --z-edge:#211d14;
  --inv-bg:#1c2b2f; --inv-fg:#e4ecea; --inv-tag:#d8a94f;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{scroll-padding-top:64px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--f-display);font-weight:900;text-wrap:balance;letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.k{font-size:12px;color:var(--muted)}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mast-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.brand svg{width:26px;height:26px}
.brand .wm{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.04em}
.brand .lb{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.nav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-size:13px;color:var(--ink-2);padding:4px 10px;border-radius:999px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.theme-t{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.theme-t:hover{color:var(--ink);border-color:var(--axis)}
.theme-t svg{width:16px;height:16px}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.prog i{display:block;height:100%;background:var(--brass);transform-origin:0 50%;transform:scaleX(0)}
.about{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:44em}
.about::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--brass);transform:translateY(-1px)}
@media (max-width:760px){.brand .lb{display:none}.mast-in{gap:10px}
  .nav{-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}
  .nav.at-end{-webkit-mask-image:none;mask-image:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start;padding-block:36px 26px}
.hero-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.edition{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.edition .src{letter-spacing:.04em}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.7rem);line-height:1.18}
.hero h1 mark{background:linear-gradient(transparent 60%,var(--brass-wash) 60%);color:inherit;padding:0 .04em}
.lede{font-size:1.08rem;color:var(--ink-2);max-width:36em;line-height:1.75}
.v-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.big-stance{display:flex;flex-direction:column;justify-content:center;padding:8px 18px;border:2px solid var(--brass);border-radius:8px;background:var(--brass-tint)}
.big-stance b{font-family:var(--f-display);font-size:1.9rem;line-height:1.1;color:var(--brass)}
.chip2{display:flex;flex-direction:column;justify-content:center;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chip2 b{font-size:1rem}
.v-data{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.6;max-width:60em}
.hero-side{padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.side-h{display:flex;flex-direction:column;gap:4px}
.side-h b{font-family:var(--f-display);font-size:1.15rem}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding-block:24px 18px}}

/* stance scale */
.ss{display:flex;flex-direction:column}
.ss-row{display:grid;grid-template-columns:7.4em minmax(0,1fr);align-items:center;column-gap:10px;min-height:34px}
.ss-row+.ss-row{border-top:1px solid var(--grid)}
.ss-head{min-height:0;padding-bottom:6px}
.ss-head .ss-cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.ss-head .ss-cols span:nth-child(3),.ss-head .ss-cols span:nth-child(4){color:var(--ink-2);font-weight:500}
@media (max-width:420px){.ss-head .ss-cols{font-size:10px;letter-spacing:-.02em}.ss-row{grid-template-columns:6.4em minmax(0,1fr)}}
.ss-name{font-size:13px;line-height:1.3}
.ss-track{position:relative;height:34px}
.ss-track::before{content:"";position:absolute;left:8.33%;right:8.33%;top:50%;height:1px;background:var(--line)}
.ss-tick{position:absolute;top:50%;width:1px;height:7px;transform:translate(-50%,-50%);background:var(--axis)}
.ss-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface);cursor:default}
.ss-dot.lv0,.ss-dot.lv1{background:var(--ink-2)}
.ss-dot.lv2{background:var(--surface);border:3px solid var(--brass)}
.ss-dot.lv3{background:var(--brass)}
.ss-dot.lv4,.ss-dot.lv5{background:var(--brass-hi)}
.ss-dot.prev{width:11px;height:11px;background:var(--surface);border:2px dashed var(--muted)}
.ss-move{position:absolute;top:50%;height:2px;transform:translateY(-50%);background:var(--muted)}
.ss-foot{font-size:11.5px;color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-block:1px solid var(--line)}
.kpi{display:flex;flex-direction:column;gap:3px;padding:16px 14px 14px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi-l{font-size:12.5px;color:var(--ink-2)}
.kpi-v{font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-top:2px}
.kpi-v small{font-size:.8rem;font-weight:500;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kpi-d{font-size:12px;color:var(--ink-2);line-height:1.45}
.kpi-r{font-size:13px;font-weight:700;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line)}
.kpi-s{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(odd){border-left:0}.kpi:nth-child(4){border-left:1px solid var(--line)}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.kpi-v{font-size:1.7rem}}

/* modules */
.mod{padding-block:52px 0}
.mod-h{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-width:52em}
.mod-h h2{font-size:clamp(1.45rem,3vw,2.05rem);line-height:1.3}
.mod-h .sub{color:var(--ink-2);font-size:14px;line-height:1.7}

/* diagnosis */
.diag{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,2fr);gap:12px;margin-bottom:12px}
.diag-h{padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--inv-bg);color:var(--inv-fg);border-radius:8px}
.diag-h .tag{color:var(--inv-tag)}
.diag-h b{font-family:var(--f-display);font-size:1.2rem;line-height:1.4;text-wrap:balance}
.diag-h span.rule{font-size:13px;opacity:.85;line-height:1.6}
.diag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.diag-c{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.diag-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meter{display:inline-flex;gap:3px}
.meter i{width:18px;height:8px;border-radius:2px;background:var(--surface-2)}
.meter i.on.crit{background:var(--crit)} .meter i.on.warn{background:var(--warn)}
.diag-lv{font-weight:700;font-size:14px}
.diag-c p{font-size:12.5px;color:var(--ink-2);line-height:1.55}
@media (max-width:980px){.diag{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.diag-grid{grid-template-columns:minmax(0,1fr)}}

/* lamps */
.lamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.lp{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--muted);min-width:0}
.lp.red{border-top-color:var(--crit)} .lp.amber{border-top-color:var(--warn)} .lp.green{border-top-color:var(--good)}
.lp-top{display:flex;align-items:baseline;gap:8px}
.lp-n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.lp-top b{font-size:15px}
.lp-state{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lp-txt{color:var(--ink);font-weight:700;font-size:13px}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.lamp.red{background:var(--crit)} .lamp.amber{background:var(--warn)} .lamp.green{background:var(--good)}
.lamp.lg{width:16px;height:16px}
.lamp.lg.red{box-shadow:0 0 0 4px var(--crit-wash)} .lamp.lg.amber{box-shadow:0 0 0 4px var(--warn-wash)} .lamp.lg.green{box-shadow:0 0 0 4px var(--good-wash)}
.lamp.sm{width:9px;height:9px}
.lp-fact{font-size:12.5px;line-height:1.55}
.lp-unlock{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.lp-unlock span{display:block;font-size:11px;color:var(--muted)}
@media (max-width:1000px){
  .lamps{grid-template-columns:minmax(0,1fr);gap:8px}
  .lp{display:grid;grid-template-columns:8.5em minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:start;border-top-width:1px;border-left:4px solid var(--muted)}
  .lp.red{border-left-color:var(--crit)} .lp.amber{border-left-color:var(--warn)} .lp.green{border-left-color:var(--good)}
  .lp-top{grid-column:1}.lp-state{grid-column:1}
  .lp-fact{grid-column:2;grid-row:1 / span 2}
  .lp-unlock{grid-column:3;grid-row:1 / span 2;margin:0;padding:0;border:0}
}
@media (max-width:640px){
  .lp{grid-template-columns:minmax(0,1fr)}
  .lp-fact,.lp-unlock{grid-column:1;grid-row:auto}
  .lp-unlock{padding-top:8px;border-top:1px dashed var(--line)}
}

/* themes */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.th{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.th-h{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:8px;align-items:start}
.th-n{font-family:var(--f-mono);font-size:12px;color:var(--brass);padding-top:3px}
.th-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.th-t h3{font-size:16px;font-weight:700}
.th-scope{font-size:12px;color:var(--muted)}
.th-pills{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.th-verdict{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.5}
.th-f{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.5}
.th-f div{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px}
@media (max-width:1100px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.themes{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;line-height:1.5;padding:1px 9px;border-radius:999px;white-space:nowrap;border:1.5px solid transparent}
.pill::before{font-size:10px;line-height:1}
.pill.lv0,.pill.lv1{background:var(--surface-2);color:var(--ink-2);border-color:var(--surface-2)}
.pill.lv0::before{content:"✕"} .pill.lv1::before{content:"▼"}
.pill.lv2{color:var(--brass);border-color:var(--brass)} .pill.lv2::before{content:"‖"}
.pill.lv3{background:var(--brass-wash);color:var(--ink);border-color:var(--brass-wash)} .pill.lv3::before{content:"●";color:var(--brass)}
.pill.lv4,.pill.lv5{background:var(--brass);color:var(--surface);border-color:var(--brass)} .pill.lv4::before,.pill.lv5::before{content:"▲"}

.ladder{display:flex;flex-direction:column;gap:5px}
.ladder ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.ladder li{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-align:center;padding:4px 2px;background:var(--surface-2);color:var(--muted);border-radius:3px;display:flex;flex-direction:column;line-height:1.3}
.ladder li.on{background:var(--crit-wash);color:var(--ink);box-shadow:inset 0 -3px 0 var(--crit);font-weight:500}
.ladder li small{font-size:10px;color:var(--ink-2)}

/* figures and charts */
.viz{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.viz figcaption{font-size:12px;color:var(--muted)}
.viz .foot{font-size:12px;color:var(--ink-2);line-height:1.55}
.bc{position:relative;--gap:10px;--axh:20px}
.bc-grid{position:absolute;top:0;bottom:var(--axh);left:calc(var(--nw) + var(--gap));right:calc(var(--vw) + var(--gap));pointer-events:none}
.bc-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.bc-grid i.zero{background:var(--axis)}
.bc-row{position:relative;display:grid;grid-template-columns:var(--nw) minmax(0,1fr) var(--vw);column-gap:var(--gap);align-items:center;min-height:28px;padding-block:2px;border-radius:4px}
.bc-row:hover,.bc-row:focus-visible{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.bc-name{font-size:12.5px;line-height:1.3;min-width:0}
.bc-name small{display:block;font-size:10.5px;color:var(--muted)}
.bc-track{position:relative;height:16px}
.bc-val{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bc-axis{display:grid;grid-template-columns:var(--nw) minmax(0,1fr) var(--vw);column-gap:var(--gap);height:var(--axh)}
.bc-ticks{position:relative}
.bc-ticks em,.ticks em{position:absolute;top:4px;transform:translateX(-50%);font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bc-ticks em.first,.ticks em.first{transform:none}
.bc-ticks em.last,.ticks em.last{transform:translateX(-100%)}
.bar{position:absolute;top:50%;height:14px;transform:translateY(-50%);min-width:2px}
.bar.neg{background:var(--neg);border-radius:4px 0 0 4px}
.bar.pos{background:var(--pos);border-radius:0 4px 4px 0}
.bar.neg.soft{background:var(--neg-soft)} .bar.pos.soft{background:var(--pos-soft)}
.bar.mag{background:var(--mag);border-radius:0 4px 4px 0} .bar.mag.hi{background:var(--brass)}
.bc.twin .bc-row{min-height:32px}
.bc.twin .bc-track{height:24px}
.bar.t1,.bar.t2{transform:none;height:9px}
.bar.t1{top:2px} .bar.t2{top:13px}
.bc.twin .bc-val{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.2;font-size:11.5px}
.bc.twin .bc-val b{font-weight:500}
.bc.twin .bc-val small{font-size:11px;color:var(--muted)}
em.ai{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;color:var(--brass);border:1px solid currentColor;border-radius:3px;padding:0 3px;line-height:1.4}
.bc-name em.ai{margin-left:5px;vertical-align:1px}
.bc-row:hover .bar,.bc-row:focus-visible .bar{filter:brightness(1.08) saturate(1.1)}
.db-line{position:absolute;top:50%;height:2px;transform:translateY(-50%);background:var(--neg)}
.db-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface)}
.db-dot.from{background:var(--surface);border:2px solid var(--neg)}
.db-dot.to{background:var(--neg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.legend i.sw2{width:16px;height:9px}
.legend i.sw2.t1{background:linear-gradient(90deg,var(--neg) 50%,var(--pos) 50%)}
.legend i.sw2.t2{background:linear-gradient(90deg,var(--neg-soft) 50%,var(--pos-soft) 50%)}
.legend.sm{font-size:11.5px;margin:2px 0 6px}

.rg{position:relative;padding-top:22px}
.rg-track{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.rg-band{position:absolute;top:0;bottom:0;background:var(--brass-wash);border-left:2px solid var(--brass);border-right:2px solid var(--brass)}
.rg-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--neg);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface)}
.rg-l{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink-2)}
.rg-l b{color:var(--ink)}
.ticks{position:relative;height:18px}

.conds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cond{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;min-width:0}
.cond-t{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.cond b{font-size:12.5px;line-height:1.35}
.cond small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.flows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flows li{display:grid;grid-template-columns:22px 3.4em minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;font-size:13px}
.flows li+li{border-top:1px solid var(--grid)}
.flows li span:last-child{color:var(--ink-2);font-size:12.5px}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.ic.ok{background:var(--good-wash);color:var(--ink)} .ic.no{background:var(--surface-2);color:var(--muted)}
.ic.ok::before{content:"✓";color:var(--good)} .ic.no::before{content:"✕"}

/* evidence */
.ev{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;flex-direction:column;gap:4px}
.panel-h h3{font-size:16.5px;font-weight:700}
.panel-h p{font-size:13px;color:var(--ink-2);line-height:1.6}
.mini{display:flex;flex-direction:column;gap:6px}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px}
.mini-h span{font-size:12px;color:var(--muted)}
.mini-n{font-size:12px;color:var(--ink-2)}
.stack{display:flex;gap:2px;height:16px}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:4px 0 0 4px} .stack i:last-child{border-radius:0 4px 4px 0}
.stack i.pos{background:var(--pos)} .stack i.neg{background:var(--neg)}
.stack-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.stack-l b{font-family:var(--f-mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.chips .k{margin-right:2px}
.chip{padding:2px 8px;border-radius:4px;background:var(--surface-2);font-size:12px}
.chip.up{box-shadow:inset 3px 0 0 var(--pos)} .chip.dn{box-shadow:inset 3px 0 0 var(--neg)}
@media (max-width:980px){.ev{grid-template-columns:minmax(0,1fr)}}

details.tt{font-size:12px}
details.tt summary{cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;list-style:none}
details.tt summary::-webkit-details-marker{display:none}
details.tt summary::before{content:"▸";color:var(--brass)}
details.tt[open] summary::before{content:"▾"}
.tt-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px}
.tt table{border-collapse:collapse;width:100%;font-size:12px}
.tt th,.tt td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
.tt th{color:var(--muted);font-weight:500;background:var(--surface-2)}
.tt td{font-variant-numeric:tabular-nums}
.tt tr:last-child td{border-bottom:0}

/* macro */
.macro-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.quad{padding:16px 18px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}
.quad svg{width:100%;max-width:340px;height:auto;display:block;font-family:var(--f-body)}
.q-cell{fill:var(--surface-2)} .q-cell.on{fill:var(--brass-wash)}
.q-lab{fill:var(--muted);font-size:13px} .q-lab.on{fill:var(--ink);font-weight:700;font-size:15px}
.q-ax{fill:var(--ink-2);font-size:12px}
.q-dot{fill:var(--brass);stroke:var(--surface);stroke-width:2.5}
.q-arrow{stroke:var(--brass);stroke-width:1.5;fill:none}
.q-note{fill:var(--ink-2);font-size:11.5px}
.q-ev{display:flex;flex-direction:column;gap:10px;font-size:12.5px;min-width:0}
.q-ev b{font-family:var(--f-display);font-size:1.15rem;display:block}
.q-ev ul{margin:0;padding-left:1.1em;color:var(--ink-2);line-height:1.6}
.q-ev .k{display:block;margin-bottom:2px}
.pair-note{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--brass)}
.pair-note b{font-family:var(--f-display);font-size:1.1rem;line-height:1.45}
.pair-vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair-vals div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface-2);border-radius:6px}
.pair-vals strong{font-size:1.6rem;line-height:1.1}
.pair-vals span{font-size:12px;color:var(--ink-2)}
.mcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mc{padding:12px 16px 10px;--nw:8.6em;--vw:5.4em;--gap:10px;min-width:0}
.mc-row{display:grid;grid-template-columns:var(--nw) minmax(0,1fr) var(--vw);column-gap:var(--gap);align-items:stretch}
.mc-row.item{min-height:40px}
.mc-row.item:hover,.mc-row.item:focus-visible{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.mc-name{display:flex;flex-direction:column;justify-content:center;padding-block:4px;min-width:0}
.mc-name b{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-name small{font-size:10.5px;color:var(--muted);line-height:1.3}
.turn{font-style:normal;font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;background:var(--brass);color:var(--surface)}
.mc-track{position:relative;background:linear-gradient(to right,var(--z-strong) 0 10%,var(--z-mid) 10% 20%,var(--z-edge) 20% 40%,transparent 40% 60%,var(--z-edge) 60% 80%,var(--z-mid) 80% 90%,var(--z-strong) 90% 100%)}
.mc-track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--axis)}
.mc-track .bar{height:10px}
.mc-val{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.conf{font-style:normal;font-family:var(--f-body);font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);min-width:2.6em;text-align:center}
.conf.c-s{border-color:var(--ink-2);color:var(--ink)}
.conf.c-e{border-style:dashed}
.mc-row.pair{box-shadow:inset 3px 0 0 var(--brass)}
.mc-row.pair .mc-name{padding-left:8px}
.mc-g{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--brass);padding:10px 0 4px}
.mc-zh{height:20px;align-items:end}
.mc-zl{position:relative}
.mc-zl em{position:absolute;bottom:2px;font-style:normal;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.mc-ax{height:20px}
@media (max-width:980px){.macro-top{grid-template-columns:minmax(0,1fr)}.mcs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.quad{grid-template-columns:minmax(0,1fr)}.mc{--nw:7.4em;--vw:5em}}

/* watch gauges */
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gg{padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;min-width:0}
.gg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}

.gg-v{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gg-num{font-size:1.75rem;font-weight:700;line-height:1.1}
.gg-num small{font-size:.8rem;font-weight:500;color:var(--ink-2);margin-left:3px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 3px;border-radius:999px;background:var(--surface-2)}
.st i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;line-height:1}
.st.good i{background:var(--good)} .st.good i::before{content:"✓"}
.st.watch i{background:var(--warn);color:#3a2a00} .st.watch i::before{content:"…"}
.st.bad i{background:var(--crit)} .st.bad i::before{content:"!"}
.gg-zl{position:relative;height:16px;font-size:10.5px;color:var(--ink-2)}
.gg-zl span{position:absolute;top:0;white-space:nowrap}
.gg-track{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.gg-z{position:absolute;top:0;bottom:0}
.gg-z.good{background:var(--good-wash);box-shadow:inset 0 -2px 0 var(--good)}
.gg-z.bad{background:var(--crit-wash);box-shadow:inset 0 -2px 0 var(--crit)}
.gg-z:first-child{border-radius:3px 0 0 3px}
.gg-mark{position:absolute;top:50%;width:4px;height:24px;border-radius:2px;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface)}

.gg-days{display:flex;gap:4px;flex-wrap:wrap;padding-block:4px}

@media (max-width:1000px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.gauges{grid-template-columns:minmax(0,1fr)}}

/* paths */
.paths{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.paths-fig{padding:12px 8px 8px}
.scroll-x{overflow-x:auto}
.paths-fig svg{display:block;min-width:600px;width:100%;height:auto}
.p-line{fill:none;stroke-linecap:round}
.p-a{stroke:var(--brass);stroke-width:5}
.p-b{stroke:var(--axis);stroke-width:2;stroke-dasharray:3 6}
.p-c{stroke:var(--crit);stroke-width:3}
.p-node{fill:var(--ink)}
.p-end-a{fill:var(--brass)} .p-end-c{fill:var(--crit)} .p-end-b{fill:var(--surface);stroke:var(--axis);stroke-width:2}
.p-t{font-family:var(--f-body);fill:var(--ink);font-size:15px;font-weight:700}
.p-s{font-family:var(--f-body);font-size:12px;font-weight:700}
.p-s.base{fill:var(--brass)} .p-s.out{fill:var(--muted)} .p-s.risk{fill:var(--crit)}
.p-d{font-family:var(--f-body);fill:var(--ink-2);font-size:12.5px}
.p-g{font-family:var(--f-body);fill:var(--muted);font-size:11.5px}
.p-o{font-family:var(--f-mono);fill:var(--muted);font-size:11px}
.trig{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.trig h3{font-size:15px}
.trig ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trig li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13px;line-height:1.55}
.dir{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.dir.good{background:var(--good-wash);box-shadow:inset 0 0 0 1px var(--good)}
.dir.crit{background:var(--crit-wash);box-shadow:inset 0 0 0 1px var(--crit)}
@media (max-width:980px){.paths{grid-template-columns:minmax(0,1fr)}}

/* agenda */
.agenda{padding:14px 16px 10px}
.tl-h{position:relative;min-width:780px;height:196px}
.tl-axis{position:absolute;left:2%;right:2%;top:100px;height:2px;background:var(--axis)}
.tl-ev{position:absolute;top:0;height:100px}
.tl-ev .lbl{position:absolute;left:0;white-space:nowrap;font-size:12.5px;padding-left:7px;border-left:1px solid var(--axis);line-height:1.3}
.tl-ev.key .lbl{font-weight:700}
.tl-ev .lbl small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
.tl-dot{position:absolute;top:96px;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
.tl-range{position:absolute;top:97px;height:8px;border-radius:4px;background:var(--ink)}
.tl-today{position:absolute;top:88px;width:2px;height:26px;background:var(--brass);transform:translateX(-50%)}
.tl-wk.tl-today-l{color:var(--brass);white-space:nowrap}
.tl-rv{position:absolute;top:116px;display:flex;gap:2px;transform:translateX(-50%)}
.tl-rv i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:10px;background:var(--brass);color:var(--surface);font-weight:500}
.tl-wk{position:absolute;top:166px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);padding-top:6px;border-top:1px solid var(--grid)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-legend i{display:inline-block}
.tl-v{display:none;list-style:none;margin:0;padding:0}
.tl-v li{display:grid;grid-template-columns:4.8em minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13px}
.tl-v li b{font-family:var(--f-mono);font-size:12.5px}
.tl-v .rv{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.tl-v .rv i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:10px;background:var(--brass);color:var(--surface)}
@media (max-width:640px){.agenda .scroll-x{display:none}.tl-v{display:block}.tl-legend{display:none}}

/* log */
.log{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:14px}
.cases{padding:6px 16px}
.cs{display:grid;grid-template-columns:2.6em minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:12px;align-items:center;padding:11px 0}
.cs+.cs{border-top:1px solid var(--grid)}
.cs-n{font-family:var(--f-mono);font-size:13px;color:var(--brass)}
.cs-t{display:flex;flex-direction:column;min-width:0}
.cs-t b{font-size:13.5px}
.cs-t span{font-size:11.5px;color:var(--muted)}
.cs-v{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.cs-r{display:block;margin-top:6px;padding-left:8px;border-left:2px solid var(--brass);font-size:12px;color:var(--ink-2);line-height:1.55}
.cs-r b{color:var(--brass);font-weight:600;margin-right:6px}
.cs-next{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rvd{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.rvd.due{background:var(--brass);border-color:var(--brass);color:var(--surface);font-weight:500}
.calib{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.calib-big{display:flex;align-items:baseline;gap:8px}
.calib-big strong{font-size:2.4rem;line-height:1}
.calib-big span{color:var(--ink-2);font-size:13px}
.layers{display:flex;flex-direction:column;gap:7px}
.layer{display:grid;grid-template-columns:4em minmax(0,1fr) 1.6em;gap:8px;align-items:center;font-size:12.5px}
.layer .trk{height:8px;background:var(--surface-2);border-radius:2px;position:relative}
.layer .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--crit)}
.layer b{font-family:var(--f-mono);text-align:right}
.calib p{font-size:12px;color:var(--ink-2);line-height:1.6}
@media (max-width:980px){.log{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.cs{grid-template-columns:2.2em minmax(0,1fr)}.cs-v,.cs-next{grid-column:2}.cs-next{justify-content:flex-start}}

/* china lens */
.cn-ft{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.cn-ft b{font-size:15px}
.cn-ft span{font-size:12.5px;color:var(--ink-2)}
.cn-row{display:grid;gap:14px}
.cn-g{grid-template-columns:repeat(3,minmax(0,1fr))}
.cn-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:14px}
@media (max-width:1000px){.cn-g{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.cn-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.cn-g{grid-template-columns:minmax(0,1fr)}}
.st.info i{background:var(--brass);color:var(--surface)} .st.info i::before{content:"→"}
.gg-title{font-size:15px;line-height:1.45}
.gg-zl span.ref{font-weight:700;color:var(--ink)}
.gg-zl span.tgt{color:var(--brass);font-weight:700}
