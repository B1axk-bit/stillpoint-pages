<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>静观后台</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/stillpoint-review-v1.svg?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/stillpoint-review-v1-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-title" content="静观复核">
<meta name="application-name" content="静观复核">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* 静观后台：和主页同一套品牌变量（墨青底、黄铜点缀、宋体标题）。版式：刊头 → 一句结论 → 五盏灯 → 编号模块 */
:root{
  --bg:#edf1f0; --surface:#fbfcfc; --surface-2:#e5ebea; --ink:#0f2027; --ink-2:#46595e; --muted:#5f7074;
  --line:#d3dcdb; --grid:#e1e8e7;
  --brass:#8a5d0c; --brass-hi:#a8721a; --brass-wash:#f0e2c2; --brass-tint:#f7f0e0;
  --good:#11905c; --good-wash:#ddeedd; --warn:#a8721a; --warn-wash:#fbeecb; --crit:#c8363b; --crit-wash:#f7dddb;
  --ser:#2a78d6; --ser-wash:#e1ebf7;
  --inv-bg:#0f2027; --inv-fg:#f4f7f6;
  --shadow:0 1px 0 rgba(15,32,39,.03),0 10px 24px -18px rgba(15,32,39,.25);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Cormorant","Garamond","Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans SC","PingFang SC","Microsoft YaHei",monospace;
  --l-red:#d03b3b; --l-amber:#e0a21a; --l-green:#11905c; --l-grey:#9aabae;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1316; --surface:#111c1f; --surface-2:#18262a; --ink:#e4ecea; --ink-2:#a6b6b4; --muted:#80918f;
  --line:#22333a; --grid:#1a282c;
  --brass:#d8a94f; --brass-hi:#e9c27a; --brass-wash:#3a2e17; --brass-tint:#1e1a12;
  --good:#25b07a; --good-wash:#12301a; --warn:#e9c27a; --warn-wash:#33290f; --crit:#ee5a5f; --crit-wash:#3a1a1a;
  --ser:#3987e5; --ser-wash:#16273a; --inv-bg:#1c2b2f; --inv-fg:#e4ecea; --shadow:none;
  --l-red:#ee5a5f; --l-amber:#e9b949; --l-green:#25b07a; --l-grey:#5c6f73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1316; --surface:#111c1f; --surface-2:#18262a; --ink:#e4ecea; --ink-2:#a6b6b4; --muted:#80918f;
  --line:#22333a; --grid:#1a282c;
  --brass:#d8a94f; --brass-hi:#e9c27a; --brass-wash:#3a2e17; --brass-tint:#1e1a12;
  --good:#25b07a; --good-wash:#12301a; --warn:#e9c27a; --warn-wash:#33290f; --crit:#ee5a5f; --crit-wash:#3a1a1a;
  --ser:#3987e5; --ser-wash:#16273a; --inv-bg:#1c2b2f; --inv-fg:#e4ecea; --shadow:none;
  --l-red:#ee5a5f; --l-amber:#e9b949; --l-green:#25b07a; --l-grey:#5c6f73; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}

/* 刊头 */
.mast{position:sticky;top:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mast-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.brand svg{width:28px;height:28px}
.brand .wm{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;letter-spacing:.1em;margin-right:-.1em}
.brand .bh{width:1px;height:16px;background:var(--line)}
.brand .lb{font-family:var(--f-latin);font-weight:600;font-size:18px;line-height:1;letter-spacing:.03em;color:var(--ink-2)}
.chip{font-family:var(--f-body);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.chip.priv{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,var(--line))}
.grow{flex:1}
.theme-t{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.theme-t:hover{color:var(--ink);border-color:var(--brass)}
.theme-t svg{width:16px;height:16px}
@media (max-width:640px){.brand .lb,.brand .bh,#asof{display:none}}

/* 结论区 */
.verdict{padding:28px 0 6px}
.tag{font-family:var(--f-body);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.verdict h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.55rem,4.2vw,2.35rem);line-height:1.3;letter-spacing:.01em;margin-top:8px;text-wrap:balance}
.verdict h1 .num{font-family:var(--f-mono);font-weight:500;color:var(--brass);letter-spacing:0}
.verdict .lede{color:var(--ink-2);margin-top:10px;max-width:46em}
.alert{margin-top:10px;padding:8px 12px;border-radius:6px;background:var(--crit-wash);color:var(--crit);font-size:14px}
.tier{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px}
.tier b{white-space:nowrap;flex:none;font-family:var(--f-body);font-weight:500;font-variant-numeric:tabular-nums;background:var(--inv-bg);color:var(--inv-fg);border-radius:999px;padding:1px 9px;font-size:12px}

/* 五盏灯 */
.lamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:22px}
@media (max-width:760px){.lamps{grid-template-columns:repeat(2,minmax(0,1fr))}.lamps .lampc:last-child{grid-column:1/-1}}
.lampc{appearance:none;font:inherit;text-align:left;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lampc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc)}
.lampc{display:flex;flex-direction:column;gap:1px}
.lampc:hover{border-color:var(--lc)}
.lampc .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.lampc .v{font-family:var(--f-body);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);margin-top:2px}
.lampc .pend{font-size:12px;color:var(--warn);margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lc);flex:none}
.c-red{--lc:var(--l-red)}.c-amber{--lc:var(--l-amber)}.c-green{--lc:var(--l-green)}.c-grey{--lc:var(--l-grey)}

/* 数字条 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:12px;box-shadow:var(--shadow)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
@media (max-width:760px){.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.stat .k{font-size:12px;color:var(--muted)}
.stat .n{font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted)}

.verdict:empty,.lamps:empty,.stats:empty,.tools:empty{display:none}
@media (max-width:640px){.tier{border-radius:14px;align-items:flex-start}}
.locked .tabs,.locked .pane{display:none}
details.fold{scroll-margin-top:72px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.banner{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--warn-wash);color:var(--warn);font-size:13px;display:none}
.banner.on{display:block}

/* 模块页签 */
.tabs{display:flex;gap:2px;margin-top:30px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;padding:10px 12px 9px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:baseline}
.tab .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.tab[aria-selected="true"] .no{color:var(--brass)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--brass-wash);color:var(--brass);border-radius:999px;padding:0 6px}
.pane{display:none;padding-top:18px}.pane.on{display:block}
.note{background:var(--brass-tint);border:1px solid color-mix(in srgb,var(--brass) 18%,var(--line));border-radius:6px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin:0 0 6px}
h2.mh{font-family:var(--f-display);font-weight:900;font-size:18px;margin:26px 0 10px}

/* 候选证据 */
.group{margin-top:22px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ghead h3{font-family:var(--f-display);font-weight:700;font-size:16px}
.ghead h3 .c{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted);margin-left:4px}
.ghint{font-size:13px;color:var(--muted);margin-top:2px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow);position:relative}
.cand.done{background:color-mix(in srgb,var(--surface) 55%,var(--bg));box-shadow:none}
.cand.done .ev{color:var(--ink-2)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.meta .d{font-family:var(--f-mono)}
.ev{margin:5px 0 8px;font-weight:500;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.ev a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ev a:hover{text-decoration-color:var(--brass)}
.zh{margin:6px 0 8px;font-weight:700;font-size:16px;line-height:1.5}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0 0 10px;font-size:13px;line-height:1.6}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.imp{color:var(--ink)}
.kv dd.auto{color:var(--muted)}
.orig{font-size:12px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.orig a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.orig a:hover{color:var(--ink);text-decoration-color:var(--brass)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cp{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.cp.cls{background:var(--brass-wash);color:var(--brass);font-weight:700}
.pts{font-family:var(--f-mono);font-size:13px;font-weight:500;padding:1px 8px;border-radius:4px;margin-left:auto}
.pts.pos{background:var(--good-wash);color:var(--good)}.pts.neg{background:var(--crit-wash);color:var(--crit)}.pts.zero{background:var(--surface-2);color:var(--muted)}
td .pts{margin-left:0}
.was{font-size:12px;color:var(--muted);width:100%}
.why{margin:8px 0 0;padding:8px 0 0 18px;border-top:1px dashed var(--line);color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
button.b{appearance:none;font:inherit;font-size:13px;border-radius:6px;padding:5px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.b:hover{border-color:var(--brass)}
button.b.pri{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
button.b.pri:hover{background:var(--brass);border-color:var(--brass)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.state{font-size:12px;padding:1px 8px;border-radius:4px;font-weight:500}
.state.confirm{background:var(--good-wash);color:var(--good)}.state.edit{background:var(--ser-wash);color:var(--ser)}.state.reject{background:var(--surface-2);color:var(--muted)}.state.add{background:var(--ser-wash);color:var(--ser)}
.state.synced{background:var(--inv-bg);color:var(--inv-fg)}
.state.pending{background:var(--warn-wash);color:var(--warn)}.state.saved{background:var(--good-wash);color:var(--good)}.state.failed{background:var(--crit-wash);color:var(--crit)}
.editor{display:none;margin-top:10px;padding:12px;border-radius:6px;background:var(--surface-2)}
.editor.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px;min-width:110px;flex:1}
select,input,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:56px;resize:vertical}

/* 表格、灯、案例 */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:12px;background:var(--surface-2)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--muted)}
.fold{margin-top:8px}
.fold summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"展开";margin-left:auto;font-size:12px;color:var(--muted)}
.fold[open] summary::after{content:"收起"}
.fold .nm{font-weight:700}
.cds-source table{min-width:700px}
.cds-source th{white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.execution-boundary{margin-top:10px;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.execution-boundary p{margin:6px 0}
.review-evidence{margin-top:10px;font-size:13px;overflow-wrap:anywhere}
.review-evidence h3{font-size:14px;margin:12px 0 5px}
.review-evidence p{margin:6px 0}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.md{font-size:14px;overflow-wrap:anywhere;margin-top:8px;border-top:1px solid var(--grid);padding-top:6px}
.md h1,.md h2{font-family:var(--f-display);font-size:16px;margin:14px 0 6px}.md h3,.md h4{font-size:14px;margin:12px 0 4px}
.md p{margin:6px 0}
.md table{margin:8px 0;display:block;overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--brass-wash);color:var(--muted)}
.md code,.note code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.md pre{white-space:pre-wrap;font-family:inherit}
.tg{font-size:12px;padding:0 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.tg.priv{background:var(--warn-wash);color:var(--warn)}
.login{margin-top:22px;max-width:640px}
.login h2{font-family:var(--f-display);font-weight:900;font-size:22px;margin:6px 0 8px}
.login ol{margin:8px 0 14px;padding-left:20px;color:var(--ink-2);font-size:14px}
</style>

<header class="mast"><div class="mast-in">
  <a class="brand" href="#" aria-label="静观 Stillpoint 后台">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3 A13 13 0 1 1 3.78 20.45" fill="none" stroke="var(--ink)" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M16 24 A8 8 0 1 1 18.74 8.48" fill="none" stroke="var(--brass)" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="2.6" fill="var(--ink)"/>
    </svg>
    <span class="wm">静观</span><i class="bh" aria-hidden="true"></i><span class="lb">Stillpoint</span>
  </a>
  <span class="chip priv">后台</span>
  <span class="grow"></span>
  <span class="chip" id="asof"></span>
  <button class="theme-t" id="theme-t" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.7 A6.3 6.3 0 0 1 8 14.3 Z" fill="currentColor"/></svg>
  </button>
</div></header>

<div class="wrap" id="app">
  <div class="banner" id="banner"></div>
  <div id="login"></div>
  <section class="verdict" id="verdict"></section>
  <div class="lamps" id="lampstrip"></div>
  <div class="stats" id="summary"></div>
  <div class="tools" id="tools"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="review" aria-selected="true"><span class="no">01</span>待复核<span class="cnt" id="cnt-review"></span></button>
    <button class="tab" role="tab" data-tab="lamps" aria-selected="false"><span class="no">02</span>灯</button>
    <button class="tab" role="tab" data-tab="ledger" aria-selected="false"><span class="no">03</span>账本</button>
    <button class="tab" role="tab" data-tab="cases" aria-selected="false"><span class="no">04</span>案例日志</button>
    <button class="tab" role="tab" data-tab="rules" aria-selected="false"><span class="no">05</span>规则</button>
  </div>

  <section class="pane on" id="p-review">
    <div class="note">先看核验后的事实、来源与“四个问题”，再复核建议。分数由原固定表计算，表示对当前 H1 主线的支持程度；你<b>确认</b>或<b>改</b>后，下一次更新才会入账。重复报道集中列出；有具体来源缺口的保留待核实。更改归类时可即时预览加减分，预览不会保存。</div>
    <div class="sub" id="prepared-info"></div>
    <div id="groups"></div>
    <div class="group">
      <div class="ghead"><h3>自己记一条</h3></div>
      <div class="cand">
        <div class="row">
          <label class="f" style="flex:3">证据（一句话）<input id="a-ev" placeholder="例如：Meta 上调 2026 资本开支下限"></label>
          <label class="f">日期<input id="a-date" type="date"></label>
          <label class="f">来源<input id="a-src" placeholder="Reuters / 财报"></label>
        </div>
        <div class="row" id="a-fields" style="margin-top:8px"></div>
        <div class="acts"><button class="b pri" id="a-save">记下</button><span class="sub" id="a-msg"></span></div>
      </div>
    </div>
  </section>

  <section class="pane" id="p-lamps"><div id="lamps"></div></section>
  <section class="pane" id="p-ledger"><div id="ledger"></div></section>
  <section class="pane" id="p-cases"><div id="cases"></div></section>
  <section class="pane" id="p-rules"><div id="rules"></div></section>
</div>

<script>
let DATA = /*__DATA__*/null;

// 深浅色切换：和主页同一个按钮、同一个记忆键，只存在这台设备的浏览器里
(function () {
  const root = document.documentElement, KEY = "stillpoint-theme";
  try { const v = localStorage.getItem(KEY); if (v === "light" || v === "dark") root.setAttribute("data-theme", v); } catch (e) {}
  document.getElementById("theme-t").addEventListener("click", () => {
    let cur = root.getAttribute("data-theme");
    if (cur !== "light" && cur !== "dark") cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    const next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();

const OPTS = {
  class: ["", "新独立", "幅度", "记忆", "噪声", "他题"],
  toward: ["", "支持", "H0", "H2", "H3", "失效"],
  strength: ["", "S", "M", "L"],
  layer: ["", "融资", "部署", "订单", "回报", "利率", "流动性", "分化"],
  cluster: ["", "融资压力", "部署受阻", "订单实证", "终端回报", "利率", "系统流动性", "分化"],
};
const LABEL = {class: "归类", toward: "方向", strength: "强度", layer: "层", cluster: "类"};
const COLOR = {red: "红", amber: "黄", green: "绿", grey: "灰"};
const ACT = {confirm: "已确认", edit: "已改归类", reject: "已驳回", add: "自己记的"};

const $ = s => document.querySelector(s);
// 对外统一写 ARGUSX（B1ack 10/22 定）；数据里的原文不改，只改显示
const esc = s => String(s ?? "").replace(/ARGUS(?!X)/g, "ARGUSX").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function sourceURL(value) {
  try {
    const url = new URL(value);
    return url.origin === "https://pddata.dtcc.com" && url.pathname.startsWith("/ppd/") ? url.href : "https://pddata.dtcc.com/ppd/secdashboard";
  } catch (_) { return "https://pddata.dtcc.com/ppd/secdashboard"; }
}
const md = d => (d || "").slice(5).replace("-", "/");

function points(s) {
  if (!s.toward) return 0;
  const side = s.toward === "支持" ? "支持" : "对立";
  const t = (DATA.points[s.class + "|" + side]) || {};
  return t[s.strength] || 0;
}
function reviewError(s) {
  if (!OPTS.class.includes(s.class) || !s.class) return "先选择证据归类。";
  if (["新独立", "幅度", "记忆"].includes(s.class)) {
    if (!OPTS.toward.includes(s.toward) || !s.toward) return "先核实它支持当前主线，还是指向其他状态。";
    if (!s.layer || !s.cluster) return "先选择证据所在的层和类。";
    if (s.class !== "记忆" && !["S", "M", "L"].includes(s.strength)) return "先选择证据强度 S、M 或 L。";
  }
  return "";
}
function ptsTag(p) {
  return `<span class="pts ${p > 0 ? "pos" : p < 0 ? "neg" : "zero"}">${p > 0 ? "+" : ""}${p}</span>`;
}
function chips(s) {
  return ["class", "toward", "strength", "layer", "cluster"].filter(k => s[k]).map(k => `<span class="cp${k === "class" ? " cls" : ""}" title="${LABEL[k]}">${esc(s[k])}</span>`).join("");
}
const CELLNAME = {H1: "融资压力型"};
const lampOf = cell => DATA.lamps.find(l => l.cell === cell);
const cellName = cell => CELLNAME[cell] || (lampOf(cell) ? lampOf(cell).name : "");
const pct = x => x == null ? "—" : Math.round(x * 100) + "%";

// ---------- state ----------
let decisions = {};          // id -> doc data
let db = null, canWrite = false, me = null;
let synced = new Set();
let STORE = DATA ? "claude" : "github";   // 内嵌数据 = Claude 里的私有版；没有数据 = GitHub Pages 版，用令牌现读

// Display the existing calculation's triggers; this does not recalculate a jump or change the ledger.
function reviewEvidenceGroups(theme) {
  const targets = Array.isArray(theme.jumps) ? [...new Set(theme.jumps)] : [];
  const items = Array.isArray(theme.jump_evidence) ? theme.jump_evidence : (Array.isArray(theme.items) ? theme.items : []);
  return targets.map(target => {
    const rows = items.filter(item => item.class === "新独立" && item.toward === target)
      .slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
    const layers = [...new Set(rows.map(item => String(item.layer || "").trim()).filter(Boolean))];
    const dates = [...new Set(rows.map(item => String(item.date || "").slice(0, 10))
      .filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date)))].sort();
    return {target, layers, dates, rows};
  });
}
function reviewEvidenceHTML(theme) {
  const groups = reviewEvidenceGroups(theme);
  if (!groups.length) return "";
  return `<details class="fold card review-evidence"><summary><span class="nm">复检触发依据 · 层与日期</span><span class="sub">从本主题已入账证据展开</span></summary>
    <p class="sub">下面列示已有跳格提示对应的“新独立”原账本记录，不在前端重新计算条件。两层、两日期只解释为何触发复检；事实、独立性及是否改格以复检记录为准，尚未自动判失效。</p>
    ${groups.map(group => `<section><h3>指向 ${esc(group.target)} · ${group.layers.length} 层、${group.dates.length} 个日期</h3>
      <p class="sub">层：${esc(group.layers.join("、") || "未注明")}；日期：${esc(group.dates.join("、") || "未注明")}</p>
      ${group.rows.length ? `<div class="scroll"><table><tr><th>日期</th><th>层</th><th>原账本证据</th></tr>${group.rows.map(item => `<tr><td class="n">${esc(item.date || "未注明")}</td><td>${esc(item.layer || "未注明")}</td><td>${esc(item.evidence || "未注明")}</td></tr>`).join("")}</table></div>` : `<p class="sub">本次没有读到可列示的匹配记录；保留警报，回到账本核对。</p>`}</section>`).join("")}</details>`;
}
function executionBoundaryHTML() {
  return `<details class="fold card execution-boundary"><summary><span class="nm">执行边界 · 主题预案，不是个人成交记录</span></summary>
    <p>2档是规则触发的风控预案。减仓比例尚未完成效果验证，不等同高胜率卖单；适用范围是对应主题仓位，不是全部资产。</p>
    <p>本页尚无本档个人执行记录，不代表已下单或已完成减仓。执行前需明确本轮主题仓位基准，并核对已经执行的部分。</p>
    <p><strong>档位持续不等于每天新增一次指令，不得每天对余仓重复减1/3。</strong>若已有执行，先核对记录与本轮基准，再判断是否仍有待执行部分。</p></details>`;
}

// ---------- header & summary ----------
function renderHead() {
  const t = DATA.themes[0], dr = t.derisk;
  const research = t.research_review;
  const reviewDone = research && research.review_complete && !research.has_new_ledger_evidence;
  $("#asof").textContent = `计分 ${DATA.generated} · 新闻候选 ${DATA.candidatesGenerated || DATA.generated} · ${DATA.version}`;
  const near = t.closest ? `离 ${t.closest}${lampOf(t.closest) ? `（${lampOf(t.closest).n} ${lampOf(t.closest).name}）` : ""}最近` : "";
  $("#verdict").innerHTML = `
    <div class="tag">主线 · ${md(t.since)} 入格 70 分起算</div>
    <h1>${esc(t.theme)} 停在 ${esc(t.cell)} ${esc(cellName(t.cell))}，<span class="num">${t.score}</span> 分</h1>
    <p class="lede">${esc(t.band)}。${esc(near)}。每一分的来历都在“账本”里，由人归类、按固定表计算。${esc(t.score)}分是证据支持分，不是正确率或预测概率；标题只是候选，核实后再确认。</p>
    ${t.alerts.length ? `<div class="alert"><strong>${reviewDone ? '原账本仍触发警报，本轮复检已完成' : '触发复检，尚未自动判失效'}</strong><br>当前展示主线仍为 ${esc(t.cell)}；原规则提示与有日期的复检结论分别保留，不由提示自动改格。</div>` : ""}
    ${t.alerts.map(a => `<div class="alert">${esc(a)}</div>`).join("")}
    ${research ? `<div class="note research-review"><b>${esc(research.headline || '主线复检记录')}</b><p>${esc(research.summary || '')}</p><p class="sub">复检 ${esc(research.asof || '未注明')}；${research.has_new_ledger_evidence ? '此后账本已有新证据，需要继续核验。' : '原账本与规则计算保留，研究结论与计分分别解释。'}</p></div>` : ''}
    ${reviewEvidenceHTML(t)}
    ${dr ? `<div class="tier"><b>减仓档 ${dr.tier}</b><span><strong>${esc(dr.name)}</strong> · ${esc(dr.action)}</span></div>
      <div class="sub" style="margin-top:6px">${esc(dr.why.join("；"))}</div>
      <p class="sub">规则触发的主题风控预案 · 比例效果待验证 · 本页尚无本档个人执行记录。<strong>不得每天对余仓重复减1/3。</strong></p>${executionBoundaryHTML()}` : ""}`;
  $("#lampstrip").innerHTML = DATA.lamps.map(l => `<button class="lampc c-${l.confirmed}" data-lamp="${esc(l.n)}" title="看这盏灯的每一票">
      <span class="nm"><span class="dot"></span>${l.n} ${esc(l.name)} · ${COLOR[l.confirmed]}</span>
      <span class="v">压力 ${+l.stress.toFixed(2)} · 不压力 ${+l.calm.toFixed(2)}</span>
      <span class="v">一致 ${pct(l.cons)} · 差 ${l.flip ?? "—"} 票翻</span>
      ${l.raw !== l.confirmed ? `<span class="pend">这期读数${COLOR[l.raw]}，等第二期确认</span>` : ""}</button>`).join("");
  const pending = DATA.candidates.filter(c => c.status !== "已记过" && !decisions[c.id] && !synced.has(c.id)).length;
  const decided = Object.values(decisions).filter(d => d.action !== "add");
  const changed = decided.filter(d => d.changed).length;
  $("#summary").innerHTML = `
    <div class="stat"><div class="k">待复核</div><div class="n">${pending}</div><div class="s">共 ${DATA.candidates.length} 条候选</div></div>
    <div class="stat"><div class="k">你改过的预填</div><div class="n">${decided.length ? Math.round(changed / decided.length * 100) + "%" : "—"}</div>
      <div class="s">${decided.length ? `处理 ${decided.length} 条，改了 ${changed} 条` : "还没有处理"}</div></div>
    <div class="stat"><div class="k">已入账</div><div class="n">${synced.size}</div><div class="s">后台复核写进账本的</div></div>
    <div class="stat"><div class="k">规则版本</div><div class="n">${esc(DATA.version)}</div><div class="s">数据 ${esc(String(DATA.generated).slice(5).replace("-", "/"))}</div></div>`;
  $("#cnt-review").textContent = pending || "";
}

// ---------- review ----------
const GROUPS = [
  {key: "score", title: "会动分的", hint: "新独立、幅度：正负建议均按原表计算；请连同反面限制和独立性理由复核。", test: c => c.status === "待确认" && ["新独立", "幅度"].includes(c.suggest.class)},
  {key: "memory", title: "不动分、只拨衰减时钟的", hint: "记忆：同类的后续报道", test: c => c.status === "待确认" && c.suggest.class === "记忆"},
  {key: "noise", title: "建议不计分的", hint: "观点、计划、股价、成交量等按原清单判断；核验程度逐条注明。", test: c => c.status === "待确认" && ["噪声", "他题"].includes(c.suggest.class), bulk: true},
  {key: "repeat", title: "本批同一事件的重复报道", hint: "核验事实已合入主条；重复条不另计分，也不拨衰减时钟。", test: c => c.status === "重复候选", bulk: true, bulkAction: "reject"},
  {key: "dup", title: "账本里已经有的", hint: "和账本某一条是同一件事，默认不再记", test: c => c.status === "已记过", bulk: true, bulkAction: "reject"},
  {key: "verify", title: "仍需补来源的", hint: "具体缺口见每条说明。补齐事实再点“改”；当前不建议分数。", test: c => c.status === "待确认" && !c.suggest.class},
];

function candHTML(c) {
  const d = decisions[c.id];
  const s = d && d.action !== "reject" ? d : c.suggest;
  const st = synced.has(c.id) ? `<span class="state synced">已入账</span>` : d ? `<span class="state ${d.action}">${ACT[d.action]}</span>` : "";
  const dis = canWrite ? "" : "disabled";
  const duplicate = ["重复候选", "已记过"].includes(c.status);
  const error = reviewError(s);
  return `<div class="cand ${d ? "done" : ""}" data-id="${c.id}">
    <div class="meta"><span class="d">${md(c.date)}</span><span>${esc(c.source)}</span>${st}${ghSaveHTML(c.id)}</div>
    ${briefHTML(c)}
    ${verificationHTML(c)}
    <div class="chips">${chips(s)}${!s.class && !(d && d.action === "reject") ? '<span class="cp">待核实 · 未计分</span>' : ptsTag(d && d.action === "reject" ? 0 : points(s))}${d && d.changed ? `<span class="was">机器原来填的：${esc([c.suggest.class, c.suggest.toward, c.suggest.strength].filter(Boolean).join(" "))}</span>` : ""}</div>
    <ul class="why">${c.why.map(w => `<li>${esc(w)}</li>`).join("")}${d && d.note ? `<li>你的备注：${esc(d.note)}</li>` : ""}</ul>
    <div class="acts">${d && !synced.has(c.id)
      ? `<button class="b" data-act="undo" ${dis}>撤销</button>`
      : synced.has(c.id) ? "" : `${duplicate ? '' : `<button class="b pri" data-act="confirm" ${error ? `disabled title="${esc(error)}"` : dis}>确认</button>`}<button class="b" data-act="edit" ${dis}>改</button><button class="b" data-act="reject" ${dis}>驳回</button>`}</div>
    <div class="editor">${editorHTML(c.suggest)}<div class="acts"><button class="b pri" data-act="save" ${error || !canWrite ? 'disabled' : ''}>保存</button><button class="b" data-act="cancel">取消</button></div></div>
  </div>`;
}

// 人工/AI 研究预填优先于旧标题摘要；定时行情刷新不覆盖已核验事实。
function briefHTML(c) {
  const b = c.brief || (DATA.brief || {})[c.id], k = c.keys || {};
  const title = c.original_title || c.evidence, url = c.original_url || c.url;
  const orig = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)} ↗</a>` : esc(title);
  if (b) return `<div class="zh">${esc(b.zh)}</div>
    <dl class="kv"><dt>公司</dt><dd>${esc(b.who)}</dd><dt>事件</dt><dd>${esc(b.what)}</dd><dt>数字</dt><dd>${esc(b.figure)}</dd><dt>影响</dt><dd class="imp">${esc(b.impact)}</dd></dl>
    <div class="orig">原标题：${orig}</div>`;
  if (c.origin === "lamp") return `<div class="ev">${esc(c.evidence)}</div>`;
  const who = (k.who || []).join("、"), nums = (k.nums || []).join("、");
  return `<div class="ev">${orig}</div>
    <dl class="kv">${who ? `<dt>公司</dt><dd>${esc(who)}</dd>` : ""}${nums ? `<dt>数字</dt><dd>${esc(nums)}</dd>` : ""}<dt>中文要点</dt><dd class="auto">还没整理，每天同步时补上</dd></dl>`;
}

function verificationHTML(c) {
  const names = {primary: "公告正文已核对", news_body: "新闻正文已核对 · 转引口径", public_mirror: "公开文件镜像已核读 · 原件访问受限", title_type: "按标题类型筛除 · 未核全文", ledger_match: "与旧账本对照", gap: "来源有缺口", rule_signal: "规则信号", title_only: "仅标题预填"};
  const sources = (c.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>（${esc(s.date)}${s.observation_date ? '，观测 '+esc(s.observation_date) : ''}）`).join("；");
  return `<div class="orig"><b>${esc(names[c.verification] || "待核验")}</b>${c.prepared_at ? ' · 整理 '+esc(c.prepared_at) : ''}${c.collected_date && c.collected_date !== c.date ? '<br>原候选日期 '+esc(c.collected_date)+'；事实日期 '+esc(c.date) : ''}${sources ? '<br>核验来源：'+sources : ''}${c.duplicate_of ? '<br>对应主条：<a href="#candidate-'+esc(c.duplicate_of)+'" data-related="'+esc(c.duplicate_of)+'">'+esc(c.duplicate_of)+'</a>' : ''}${c.gap ? '<br><b>待补：</b>'+esc(c.gap) : ''}${c.source_limit ? '<br><b>口径限制：</b>'+esc(c.source_limit) : ''}</div>`;
}

function previewHTML(s) {
  const error = reviewError(s);
  return error ? `<span class="sub">待补齐：${esc(error)}</span>` : `建议分数 ${ptsTag(points(s))}<span class="sub">确认保存后，下一次更新入账</span>`;
}
function editorHTML(s) {
  return `<div class="row">${["class", "toward", "strength", "layer", "cluster"].map(k => `<label class="f">${LABEL[k]}<select data-f="${k}">${OPTS[k].map(o => `<option ${o === (s[k] || "") ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`).join("")}</div>
    <div class="score-preview acts" aria-live="polite">${previewHTML(s)}</div>
    <label class="f" style="margin-top:8px">备注（为什么改）<textarea data-f="note"></textarea></label>`;
}

function renderReview() {
  const times = DATA.candidates.map(c => c.prepared_at).filter(Boolean).sort();
  $("#prepared-info").textContent = times.length ? `研究预填：${times.at(-1)} · ${times.length} 条已整理；日期与行情快照分开。` : "当前为标题预填，核实后再确认。";
  $("#groups").innerHTML = GROUPS.map(g => {
    const items = DATA.candidates.filter(g.test);
    const open = items.filter(c => !decisions[c.id] && !synced.has(c.id)).length;
    return `<div class="group" data-g="${g.key}">
      <div class="ghead"><h3>${g.title}<span class="c">${items.length}</span></h3>
        ${g.bulk && open ? `<button class="b" data-bulk="${g.key}" ${canWrite ? "" : "disabled"}>这一组剩下的 ${open} 条全部${g.bulkAction === "reject" ? "驳回" : "确认"}</button>` : ""}</div>
      <div class="ghint">${g.hint}</div>
      ${items.length ? items.map(candHTML).join("") : `<div class="empty">没有</div>`}</div>`;
  }).join("");
  const own = Object.entries(decisions).filter(([, d]) => d.action === "add");
  if (own.length) {
    $("#groups").insertAdjacentHTML("beforeend", `<div class="group"><div class="ghead"><h3>你自己记的<span class="c">${own.length}</span></h3></div>${own.map(([id, d]) => `
      <div class="cand done" data-id="${id}"><div class="meta"><span class="d">${md(d.date)}</span><span>${esc(d.source)}</span>${synced.has(id) ? `<span class="state synced">已入账</span>` : `<span class="state add">自己记的</span>`}${ghSaveHTML(id)}</div>
      <div class="ev">${esc(d.evidence)}</div><div class="chips">${chips(d)}${ptsTag(points(d))}</div>
      ${synced.has(id) ? "" : `<div class="acts"><button class="b" data-act="undo" ${canWrite ? "" : "disabled"}>删掉</button></div>`}</div>`).join("")}</div>`);
  }
}

async function write(id, data) {
  if (STORE === "github") return ghWrite(id, data);
  if (!db) return false;
  try {
    if (data === null) await db.collection("decisions").doc(id).delete();
    else await db.collection("decisions").doc(id).set(data);
    return true;
  } catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; showBanner("这个视图不能写入，复核结果存不下来。"); renderAll(); }
    else showBanner("没存上（" + (e && e.code || "unknown") + "），稍后再点一次。");
    return false;
  }
}

function record(c, action, s, note) {
  if (!canWrite) return;
  if (action !== "reject") {
    const error = reviewError(s);
    if (error) { showBanner(error); return; }
  }
  const keys = ["class", "toward", "strength", "layer", "cluster"];
  const changed = action === "reject" ? false : keys.some(k => (s[k] || "") !== (c.suggest[k] || ""));
  const doc = {cid: c.id, action: action === "confirm" && changed ? "edit" : action, changed, note: note || "",
    date: c.date, evidence: c.evidence, source: c.source, url: c.url || "", theme: c.theme,
    machine: c.suggest, original_title: c.original_title || c.evidence, verification: c.verification,
    sources: c.sources || [], prepared_at: c.prepared_at || "", event_key: c.event_key || "",
    at: new Date().toISOString(), by: me || STORE};
  keys.forEach(k => doc[k] = action === "reject" ? "" : (s[k] || ""));
  decisions[c.id] = doc; renderAll();
  return write(c.id, doc);
}

function go(tab) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "p-" + tab));
}

document.addEventListener("click", e => {
  const related = e.target.closest("[data-related]");
  if (related) {
    e.preventDefault();
    const card = document.querySelector(`.cand[data-id="${related.dataset.related}"]`);
    if (card) card.scrollIntoView({behavior: "smooth", block: "center"});
    return;
  }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.retrySave) {
    const op = ghSaves.get(b.dataset.retrySave);
    if (op && op.state === "failed") ghWrite(op.id, op.data);
    return;
  }
  if (b.classList.contains("tab")) { go(b.dataset.tab); return; }
  if (b.dataset.lamp) {
    go("lamps");
    const el = document.querySelector(`#lamps details[data-lamp="${b.dataset.lamp}"]`);
    if (el) { el.open = true; el.scrollIntoView({behavior: "smooth", block: "start"}); }
    return;
  }
  if (b.dataset.bulk) {
    const g = GROUPS.find(x => x.key === b.dataset.bulk);
    const todo = DATA.candidates.filter(g.test).filter(c => !decisions[c.id] && !synced.has(c.id));
    // GitHub 写入本身已串行：先把整组操作入队，后来的手动改动才能最后生效。
    if (STORE === "github") for (const c of todo) record(c, g.bulkAction || "confirm", c.suggest, "整组处理");
    else (async () => { for (const c of todo) await record(c, g.bulkAction || "confirm", c.suggest, "整组处理"); })();
    return;
  }
  const card = b.closest(".cand"); if (!card) return;
  const id = card.dataset.id, c = DATA.candidates.find(x => x.id === id), act = b.dataset.act;
  if (act === "undo") { delete decisions[id]; renderAll(); write(id, null); }
  else if (act === "confirm") record(c, "confirm", c.suggest);
  else if (act === "reject") record(c, "reject", c.suggest);
  else if (act === "edit") card.querySelector(".editor").classList.add("on");
  else if (act === "cancel") card.querySelector(".editor").classList.remove("on");
  else if (act === "save") {
    const s = {}; card.querySelectorAll(".editor [data-f]").forEach(x => s[x.dataset.f] = x.value);
    record(c, "confirm", s, s.note);
  }
});

function parseAttractorReport(text) {
  if (!text) return null;
  try {
    const report = JSON.parse(text);
    if (!report || !["ok", "review", "partial", "failed"].includes(report.status) || !Array.isArray(report.rows) ||
        (report.missing != null && !Array.isArray(report.missing)) ||
        report.rows.some(row => !row || !row.quality || !Array.isArray(row.quality.reasons))) throw new Error("invalid report");
    return report;
  } catch (error) {
    return {status: "failed", rows: [], error: "吸引子校验记录无法读取，需要重新采集；其余后台数据仍可查看。"};
  }
}

const GH = {repo: "B1axk-bit/stillpoint-data", branch: "main", key: "stillpoint-admin-token", decisions: "confidence/decisions.json"};
let ghToken = "", ghSha = null, ghQueue = Promise.resolve();
let ghRunning = false;
let ghSaved = {};                         // 已确认的远端基线；不混入待保存/失败的操作
const ghSaves = new Map();                 // 每个 id 的最新操作及保存状态（包括撤销）
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const b64 = str => { const u = new TextEncoder().encode(str); let s = ""; u.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const unb64 = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function gh(path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${GH.repo}/${path}`, Object.assign({}, opt, {
    headers: Object.assign({Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}, opt.headers || {}),
  }));
  return r;
}
async function ghFile(path, optional) {
  const r = await gh(`contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${GH.branch}`);
  if (r.status === 404 && optional) return {text: null, sha: null};
  if (!r.ok) throw new Error(path + "：HTTP " + r.status);
  const j = await r.json();
  if (j.content == null || j.encoding !== "base64") {   // 超过 1 MB 的文件走 raw
    const raw = await gh(`contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${GH.branch}`, {headers: {Accept: "application/vnd.github.raw+json"}});
    if (!raw.ok) throw new Error(path + "：HTTP " + raw.status);
    return {text: await raw.text(), sha: j.sha};
  }
  return {text: unb64(j.content), sha: j.sha};
}

      ghFile("confidence/brief.json", true), ghFile("archive/attractor/latest-quality.json", true)]);
    const L = JSON.parse(latest.text), C = JSON.parse(cand.text), R = JSON.parse(rubric.text);
    const rev = (reviewed.text || "").trim().split("\n").slice(1).map(line => line.split(","));
    DATA = {generated: L.run_at, candidatesGenerated: C.generated, version: L.version, since: C.since, lamps: L.lamps, themes: L.themes, candidates: C.candidates, cds: L.cds || {},
      points: L.points || {}, synced: rev.filter(x => x[4] === "1").map(x => x[0]),
      strength: R.strength, changelog: R.changelog, derisk: R.derisk, cases: cases.text ? JSON.parse(cases.text) : null,
      brief: brief.text ? (JSON.parse(brief.text).items || {}) : {},
      attractor: parseAttractorReport(attractor.text), sourceHealth: L.source_health || null};
    decisions = dec.text ? JSON.parse(dec.text) : {};
    ghSaved = {...decisions}; ghSaves.clear();
    ghSha = dec.sha;
    if (remember) lsSet(GH.key, ghToken);
    canWrite = true;
    $("#login").innerHTML = "";
    $("#tools").innerHTML = `<button class="b" id="gh-run" title="跑一次自动更新，约 3 分钟">即刻更新</button><button class="b" id="gh-out" title="清掉这台设备上的令牌">退出</button><span class="sub" id="gh-msg">保存成功的条目，每天自动更新时入账；等不及可以点“即刻更新”。</span><div id="gh-save-status" role="status" aria-live="polite" style="width:100%"></div>`;
    $("#gh-out").onclick = () => { lsSet(GH.key, ""); location.reload(); };
    $("#gh-run").onclick = ghRun;
    start();
  } catch (e) {
    ghToken = ""; loginView("连不上：" + e.message + "。检查令牌是不是只给了 stillpoint-data、Contents 有没有读写权限、有没有过期。");
  }
}

function ghApply(base, op) {
  const next = {...base};
  if (op.data === null) delete next[op.id]; else next[op.id] = op.data;
  return next;
}
function ghRefreshView() {
  decisions = {...ghSaved};
  for (const op of ghSaves.values()) if (op.state !== "saved") decisions = ghApply(decisions, op);
  renderAll();
}
function ghSaveHTML(id) {
  if (STORE !== "github") return "";
  const op = ghSaves.get(id), state = op ? op.state : decisions[id] ? "saved" : "";
  return state ? `<span class="state ${state}">${op && op.data === null ? "撤销 · " : ""}${{pending: "待保存", saved: "保存成功", failed: "保存失败"}[state]}</span>` : "";
}
function renderGhSaveStatus() {
  const el = $("#gh-save-status");
  if (STORE !== "github" || !el) return;
  const ops = [...ghSaves.values()], count = state => ops.filter(op => op.state === state).length;
  el.innerHTML = `<span class="sub">待保存 ${count("pending")} 项 · 保存成功 ${count("saved")} 项 · 保存失败 ${count("failed")} 项</span>` +
    (ops.some(op => op.state !== "saved") ? `<div class="sub">未保存的操作仅保留在本页，关闭或刷新前请等待保存成功，失败时点“重试保存”。</div>` : "") +
    ops.filter(op => op.state === "failed").map(op => `<div class="acts">${ghSaveHTML(op.id)}<span class="sub">${esc(op.label)}：${esc(op.error)}</span><button class="b" data-retry-save="${esc(op.id)}">重试保存</button></div>`).join("");
}
function ghWrite(id, data) {
  // 捕获单条操作；后续点击和冲突重读都不能改变它的内容。
  const op = {id, data: data === null ? null : JSON.parse(JSON.stringify(data)), state: "pending", error: "",
    label: ((data || decisions[id] || ghSaved[id] || (ghSaves.get(id) || {}).data || {}).evidence || id).slice(0, 60)};
  ghSaves.set(id, op); ghRefreshView();
  const task = ghQueue.then(async () => {
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const next = ghApply(ghSaved, op);  // 每次重试都从远端基线重放这一条，绝不序列化乐观视图
        const body = {message: "后台复核：" + (op.data ? (op.data.action + " " + (op.data.evidence || "").slice(0, 40)) : "撤销 " + id),
          content: b64(JSON.stringify(next, null, 1)), branch: GH.branch};
        if (ghSha) body.sha = ghSha;
        const r = await gh(`contents/${GH.decisions}`, {method: "PUT", body: JSON.stringify(body)});
        if (r.ok) {
          const sha = (await r.json()).content.sha;
          if (!sha) throw new Error("写入响应缺少 SHA，保存结果未确认，请重试。");
          ghSaved = next; ghSha = sha; op.state = "saved"; ghRefreshView();
          return true;
        }
        if (r.status === 409 || r.status === 422) {
          const cur = await ghFile(GH.decisions, true);
          const server = cur.text ? JSON.parse(cur.text) : {};
          if (!server || Array.isArray(server) || typeof server !== "object") throw new Error("远端复核记录格式错误。");
          ghSaved = server; ghSha = cur.sha; ghRefreshView();
          if (attempt < 2) continue;
          throw new Error("冲突重试已达上限，请重试保存。");
        }
        throw new Error(r.status === 403 || r.status === 404 ? "令牌没有写入权限（Contents 要选 Read and write）。" : "HTTP " + r.status);
      }
    } catch (e) {
      op.state = "failed"; op.error = e.message || "保存结果未确认，请重试。";
      ghRefreshView();
      return false;
    }
  });
  ghQueue = task.catch(() => false);        // 单条异常不阻断后续任务
  return task;
}

window.addEventListener("beforeunload", e => {
  if (STORE === "github" && [...ghSaves.values()].some(op => op.state !== "saved")) { e.preventDefault(); e.returnValue = ""; }
});

async function ghRun() {
  if (ghRunning) return;
  ghRunning = true; $("#gh-run").disabled = true;
  try {
    $("#gh-msg").textContent = "正在等待复核记录保存…";
    let tail;
    do { tail = ghQueue; await tail; } while (tail !== ghQueue);
    if ([...ghSaves.values()].some(op => op.state !== "saved")) {
      $("#gh-msg").textContent = "还有未保存的复核操作，请先重试保存成功，再即刻更新。";
      return;
    }
    $("#gh-msg").textContent = "正在请求…";
    const r = await gh("actions/workflows/snapshot.yml/dispatches", {method: "POST", body: JSON.stringify({ref: GH.branch})});
    $("#gh-msg").textContent = r.status === 204 ? "更新请求已受理，任务是否成功请查看运行记录；完成后刷新页面查看入账结果。"
      : r.status === 403 ? "令牌没有 Actions 权限，这个按钮用不了；每天的自动运行照样会入账。" : "没跑起来（HTTP " + r.status + "）。";
  } catch (e) {
    $("#gh-msg").textContent = "更新请求结果未确认，请先查看运行记录，避免重复启动。";
  } finally {
    ghRunning = false; $("#gh-run").disabled = false;
  }
}

if (STORE === "claude") { start(); connectClaude(); }
else { $("#app").classList.add("locked"); ghToken = lsGet(GH.key); ghToken ? ghLoad(false) : loginView(""); }
</script>
</body></html>
